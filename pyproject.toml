[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "webdata-delivery-kit"
version = "0.1.0"
description = "From a scraping brief to a validated, delivery-ready dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Sebastian Ruiz Akle" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
sheets = ["gspread>=6.0"]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.45", "gspread>=6.0"]

[project.scripts]
wdk = "wdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wdk.cases.jobs" = ["companies.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real websites (run with: pytest -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
